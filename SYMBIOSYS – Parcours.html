<head>

<title>SYMBIOSYS – Parcours</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6f7;--card:#fff;--ink:#0d4a57;--mut:#3c7a86;--acc:#0a7d8f;--acc2:#f29a3d;--line:#bfe0e4;--on:#fff;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2a31;--card:#0f3a44;--ink:#e3f6f8;--mut:#9acdd4;--acc:#3cc3d6;--acc2:#f5a94f;--line:#1d5562;--on:#062a31}}
:root[data-theme="dark"]{--bg:#0a2a31;--card:#0f3a44;--ink:#e3f6f8;--mut:#9acdd4;--acc:#3cc3d6;--acc2:#f5a94f;--line:#1d5562;--on:#062a31}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.5}
h1,h2{font-family:Fredoka,system-ui,sans-serif;margin:0}
header{padding:18px 16px 8px;text-align:center}
header h1{font-size:2rem;color:var(--acc);letter-spacing:.04em}
header p{margin:2px 0 0;color:var(--mut);font-size:.85rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 .8rem Montserrat,sans-serif;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
nav button.has::after{content:" ●";color:var(--acc2);font-size:.7rem}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:12px;background:var(--line);color:var(--ink)}
.badge.new{background:var(--acc2);color:#3a2100}
h2{font-size:1.5rem;margin:8px 0 2px;line-height:1.2}
.sub{color:var(--mut);margin:0 0 14px}
.sc{border-left:4px solid var(--acc);padding:2px 0 2px 12px;margin:12px 0}
.sc b{display:block;font-size:.85rem;color:var(--acc)}
.sc span{font-size:.93rem}
.stage{margin:16px 0;border-radius:14px;overflow:hidden;background:#06242a;min-height:170px;display:flex;align-items:center;justify-content:center;position:relative}
.stage video{width:100%;max-height:70vh;display:block}
.stage .ph{color:#9acdd4;text-align:center;padding:24px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:0;border-radius:12px;padding:12px 14px;font:600 .95rem Montserrat,sans-serif;background:var(--acc);color:var(--on);cursor:pointer;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.info{margin-top:16px;padding:14px;border-radius:12px;border:2px solid var(--line)}.info b{color:var(--acc);font-size:.9rem}.info p{margin:4px 0 12px;font-size:.92rem}.info p:last-child{margin-bottom:0}
.mcard{margin:14px 0;padding:14px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.mhead b{display:block;color:var(--acc);font-size:1rem}.mhead span{font-size:.78rem;color:var(--mut)}
.mol{width:100%;height:200px;display:block;margin:6px 0}
.b{stroke:var(--acc);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .45s ease-out forwards}
.b.r{stroke-width:2;stroke-opacity:.6}
@keyframes dr{to{stroke-dashoffset:0}}
.at{font:600 15px Montserrat,sans-serif;fill:var(--acc2);paint-order:stroke;stroke:var(--card);stroke-width:6px;opacity:0;animation:fi .4s ease-out forwards}
@keyframes fi{to{opacity:1}}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 4s ease-in-out 3s infinite alternate}
@keyframes fl{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.b{animation:none;stroke-dashoffset:0}.at{animation:none;opacity:1}.fl{animation:none}}
.qz{margin-top:16px;padding:14px;border-radius:12px;border:2px solid var(--acc)}
.qz .qt{color:var(--acc);font-size:1rem;display:block}.qz small{color:var(--mut)}
.qz .qq{font-weight:600;margin:4px 0 8px}
.qz button.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 .9rem Montserrat,sans-serif;cursor:pointer}
.qz button.o.ok{border-color:#2e9e5b;background:rgba(46,158,91,.2)}.qz button.o.ko{border-color:#d9534f;background:rgba(217,83,79,.2)}
.qz .ex{font-size:.88rem;margin:8px 0}.qz .qs{font-size:1.2rem;font-weight:600;margin:8px 0}
.mapc{margin-top:16px;padding:14px;border-radius:12px;border:2px solid var(--line)}
.mapc .mt{color:var(--acc);display:block;margin-bottom:6px}.map{width:100%;height:auto;display:block}
.rt{stroke:var(--acc2);stroke-width:4;stroke-dasharray:6 6;stroke-linecap:round;animation:fw 1s linear infinite}
@keyframes fw{to{stroke-dashoffset:-12}}
.pl{transform-box:fill-box;transform-origin:center;animation:pu 1.8s ease-out infinite}
@keyframes pu{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
.mn{font:600 11px Montserrat,sans-serif;fill:var(--on)}
.ml{font:600 11px Montserrat,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.mx{margin:8px 0;font-size:.92rem}.mn2{font-size:.78rem;color:var(--mut);margin:8px 0 0}
a.btn{display:block;text-decoration:none}
@media(prefers-reduced-motion:reduce){.rt,.pl{animation:none}}
.guide{margin-top:16px;padding:12px;border-radius:12px;background:var(--bg);font-size:.9rem}
.guide b{color:var(--acc2)}
.tools{margin-top:22px;text-align:center;font-size:.8rem;color:var(--mut)}
.tools label{display:inline-block;margin:6px 0}
input[type=file]{display:none}
details{margin-top:14px;font-size:.85rem;color:var(--mut)}
</style>
</head>

{n:"Tortue marine",i:"La tortue verte (Chelonia mydas) atteint près d'1 m de carapace et peut peser plus de 100 kg. Jeune, elle mange un peu de tout ; adulte, elle devient végétarienne et broute les herbiers du lagon, ce qui les garde en bonne santé. Le lagon calédonien, classé à l'UNESCO, est l'un de ses lieux de vie et de ponte.",a:"Une femelle revient pondre sur la plage où elle est née, parfois des décennies plus tard et après des milliers de kilomètres de voyage. Et la température du sable décide du sexe des bébés : plus il fait chaud, plus il naît de femelles.",t:"La Tortue marine, l'éco-jardinière du lagon",b:"Fresque existante",
