<head>

<title>SYMBIOSYS – Parcours</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6f7;--card:#fff;--ink:#0d4a57;--mut:#3c7a86;--acc:#0a7d8f;--acc2:#e8891f;--line:#bfe0e4;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2a31;--card:#0f3a44;--ink:#e3f6f8;--mut:#9acdd4;--acc:#3cc3d6;--acc2:#f5a94f;--line:#1d5562;--on:#062a31}}
:root[data-theme="dark"]{--bg:#0a2a31;--card:#0f3a44;--ink:#e3f6f8;--mut:#9acdd4;--acc:#3cc3d6;--acc2:#f5a94f;--line:#1d5562;--on:#062a31}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Montserrat,system-ui,sans-serif}
h1,h2{font-family:Fredoka,system-ui,sans-serif;margin:0;font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
.top .in{max-width:560px;margin:0 auto}
.brand{font:600 1.3rem Fredoka,sans-serif;color:var(--acc);letter-spacing:.05em;margin-bottom:6px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-height:40px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 .85rem Montserrat,sans-serif;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
body.v-parcours main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.steps{display:flex;flex-direction:column;gap:14px}
.sec,.mcard,.info,.qz,.mapc,.hero,.who{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--line);color:var(--ink)}
.badge.new{background:var(--acc2);color:#3a2100}
.cnt{font-size:.8rem;color:var(--mut);font-weight:600}
h2{font-size:clamp(1.3rem,5.5vw,1.6rem);line-height:1.2}
.dots{display:flex;gap:8px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--mut);font:600 .7rem Montserrat,sans-serif;padding:0;cursor:pointer}
.dot.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.sub{margin:0;color:var(--mut);font-size:.92rem}
.stage{aspect-ratio:16/9;width:100%;border-radius:12px;background:#06242a;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
.stage video{width:100%;height:100%;object-fit:contain;display:block}
.stage .ph{color:#9acdd4;text-align:center;padding:16px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:46px;border:0;border-radius:12px;padding:10px 14px;font:600 .95rem Montserrat,sans-serif;background:var(--acc);color:var(--on);cursor:pointer;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn:focus-visible,.tabs button:focus-visible,.dot:focus-visible,.qz button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.mhead b,.mapc .mt,.qz .qt{display:block;color:var(--acc);font-size:1rem}.mhead span{font-size:.78rem;color:var(--mut)}
.mol{width:100%;height:190px;display:block;margin:8px 0}
.m3wrap{position:relative;margin:8px 0}
.m3{width:100%;height:310px;display:block;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(10,125,143,.10),transparent 70%);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.m3:active{cursor:grabbing}
.m3hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.72rem;color:var(--mut);pointer-events:none;transition:opacity .4s}
.m3bar{display:flex;gap:8px;margin-top:8px}.m3bar .btn{min-height:42px;font-size:.85rem}
.b{stroke:var(--acc);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .45s ease-out forwards}
.b.r{stroke-width:2;stroke-opacity:.6}
@keyframes dr{to{stroke-dashoffset:0}}
.at{font:600 15px Montserrat,sans-serif;fill:var(--acc2);paint-order:stroke;stroke:var(--card);stroke-width:6px;opacity:0;animation:fi .4s ease-out forwards}
@keyframes fi{to{opacity:1}}
.info b{color:var(--acc);font-size:.9rem}.info p{margin:4px 0 12px;font-size:.93rem}.info p:last-child{margin-bottom:0}
.qz{border:2px solid var(--acc)}.qz small{color:var(--mut)}.qz .qq{font-weight:600;margin:4px 0 8px}
.qz button.o{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 .92rem Montserrat,sans-serif;cursor:pointer}
.qz button.o.ok{border-color:#2e9e5b;background:rgba(46,158,91,.2)}.qz button.o.ko{border-color:#d9534f;background:rgba(217,83,79,.2)}
.qz .ex{font-size:.88rem;margin:8px 0}.qz .qs{font-size:1.2rem;font-weight:600;margin:8px 0}
.guide{font-size:.92rem;background:var(--card);border-left:5px solid var(--acc2)}.guide b{color:var(--acc2)}
.map{width:100%;height:auto;display:block}
.rt{stroke:var(--acc2);stroke-width:4;stroke-dasharray:6 6;stroke-linecap:round}
.pl{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-out infinite}
@keyframes pu{from{transform:scale(1);opacity:.55}to{transform:scale(2.3);opacity:0}}
.mn{font:600 11px Montserrat,sans-serif;fill:var(--on)}
.ml{font:600 11px Montserrat,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.mx{margin:8px 0;font-size:.92rem}.mn2{font-size:.78rem;color:var(--mut);margin:8px 0 0}
.hero{border-left:5px solid var(--acc)}.hero h2{font-size:clamp(1.8rem,9vw,2.4rem);color:var(--acc);margin-bottom:6px}
.hero p,.who p{margin:0 0 12px}
.how{margin:0;padding-left:20px}.how li{margin:4px 0}
.ppl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
.pp{text-align:center}.pp img{width:min(120px,100%);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:block;margin:0 auto 6px}
.pp b{display:block;font-size:.95rem;line-height:1.25}.pp span{font-size:.8rem;color:var(--mut)}
.who h2{margin-bottom:10px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none}
#barin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
#barin .bc{font-weight:600;font-size:.85rem;color:var(--mut);min-width:40px;text-align:center}
.tools{margin-top:14px;font-size:.85rem;color:var(--mut);display:none}
.tools summary{min-height:40px;display:flex;align-items:center}
.brandbar{position:relative;z-index:1;text-align:center;padding:18px 12px 8px}
.brand{font:600 clamp(2.2rem,11vw,3rem) Fredoka,sans-serif;color:var(--acc);letter-spacing:.06em;line-height:1;margin:0}
.top{padding:0 12px;border-bottom:1px solid var(--line)}
.tabs{gap:0}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;min-height:42px;font:600 .82rem Montserrat,sans-serif;color:var(--mut)}
.tabs button.on{background:transparent;color:var(--acc);border-bottom-color:var(--acc)}
main{position:relative;z-index:1}
#bgimg{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;opacity:.13;pointer-events:none;display:none}
body.v-parcours #bgimg{display:block}
.stage{position:relative}
.stage.nov::before{content:"";position:absolute;inset:0;background:var(--img) center/cover no-repeat;opacity:.5}
.stage .ph{position:relative;z-index:1;color:#fff;font-weight:600;font-size:1rem;text-shadow:0 1px 8px #000,0 0 3px #000}
.stage .ph small{display:block;font-weight:500;font-size:.8rem;opacity:.9;margin-top:2px}
.home{text-align:center;padding:36px 4px 12px}
.home h2{font-size:clamp(2.4rem,13vw,3.4rem);color:var(--acc);margin-bottom:10px}
.home p{margin:0 auto 26px;max-width:32ch;color:var(--ink);font-size:1.02rem}
.home .btn{width:100%;max-width:320px;flex:none}
@media(prefers-reduced-motion:reduce){.b{animation:none;stroke-dashoffset:0}.at{animation:none;opacity:1}.pl{animation:none}}

.stage{position:relative}.stage .beam,.stage .cap,.stage .hint{position:absolute;pointer-events:none}
.beam{left:0;right:0;top:0;height:3px;background:#8ff;box-shadow:0 0 18px 7px rgba(80,230,255,.85);display:none;z-index:2}
.stage.scanning .beam{display:block;animation:bm 1.3s ease-in-out 2}
.stage.scanning::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(80,230,255,.12) 0 2px,transparent 2px 6px);z-index:1;pointer-events:none}
@keyframes bm{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
.stage.hv{background:var(--img) center/cover no-repeat}
.stage.hv video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
.stage.hv.playing video{opacity:1}
.stage .hint{left:10px;right:10px;bottom:10px;z-index:2;text-align:center;background:rgba(6,36,42,.82);color:#e3f6f8;padding:7px 10px;border-radius:10px;font-size:.8rem;transition:opacity .4s}
.stage.playing .hint,.stage.scanning .hint{opacity:0}
.stage.shown .cap{opacity:1;transform:none}
.cap{left:10px;right:10px;bottom:10px;background:rgba(6,36,42,.85);color:#e3f6f8;padding:8px 12px;border-radius:10px;font-size:.8rem;line-height:1.35;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;z-index:3}
.mcard.pulse{animation:mp 1.6s ease-out 1}@keyframes mp{0%{box-shadow:0 0 0 0 rgba(232,137,31,.75)}100%{box-shadow:0 0 0 18px rgba(232,137,31,0)}}
#scn{position:fixed;inset:0;z-index:50;background:rgba(3,20,24,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#e3f6f8;text-align:center}
#scn[hidden]{display:none}
.scv{position:relative;width:min(88vw,400px);aspect-ratio:1;border-radius:18px;overflow:hidden;background:#000}
.scv video{width:100%;height:100%;object-fit:cover;display:block}
.frm{position:absolute;inset:16%;border:3px solid #f5a94f;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.4)}
.scl{position:absolute;left:16%;right:16%;top:16%;height:2px;background:#8ff;box-shadow:0 0 10px 3px rgba(80,230,255,.8);animation:sl 2s ease-in-out infinite alternate}
@keyframes sl{to{top:84%}}
#scn p{margin:0;max-width:34ch;font-size:.92rem}#scn .row{width:min(88vw,400px)}#scn .btn.alt{color:#e3f6f8;border-color:#3c7a86}
</style>
</head>

var S=[
{n:"Tortue marine",i:"La tortue verte (Chelonia mydas) atteint près d'1 m de carapace et peut peser plus de 100 kg. Jeune, elle mange un peu de tout ; adulte, elle devient végétarienne et broute les herbiers du lagon, ce qui les garde en bonne santé. Le lagon calédonien, classé à l'UNESCO, est l'un de ses lieux de vie et de ponte.",a:"Une femelle revient pondre sur la plage où elle est née, parfois des décennies plus tard et après des milliers de kilomètres de voyage. Et la température du sable décide du sexe des bébés : plus il fait chaud, plus il naît de femelles.",t:"La Tortue marine, l'éco-jardinière du lagon",b:"Fresque existante",

ma:"La mangrove est un filtre biologique géant : elle arrête les derniers sédiments venus de la terre. Mais pour grandir et se régénérer, elle a besoin de nouveaux arbres.",
g:"L'image remonte au-dessus de la surface de l'eau, le long d'un tronc. Un oiseau vient de se poser dans les branches. Une flèche indique la fresque suivante : le loriquet."},
{n:"Loriquet",i:"Le loriquet à tête bleue (Trichoglossus haematodus deplanchii) est une sous-espèce de perroquet propre à la Nouvelle-Calédonie et aux îles Loyauté. Son plumage bleu, vert, jaune et orange se repère de loin, et il vit en bandes bruyantes qui suivent les arbres en fleurs.",a:"Sa langue se termine par une petite brosse de minuscules papilles, parfaite pour lécher le nectar. Le pollen s'y colle, puis sur ses plumes : en passant de fleur en fleur, il pollinise comme une abeille.",t:"Le Loriquet, le messager de la canopée",b:"Fresque existante",

{n:"Hibiscus",i:"L'hibiscus est l'une des fleurs les plus emblématiques du Pacifique. Sur les côtes calédoniennes pousse notamment l'hibiscus de mer (Hibiscus tiliaceus), un arbuste robuste qui résiste au sel, au vent et aux sols pauvres. Ses racines aident à tenir la terre en bord de plage.",a:"Chaque fleur ne dure qu'une journée. Chez l'hibiscus de mer, elle s'ouvre jaune le matin, vire à l'orange puis au rouge sombre, et tombe le soir. Son écorce servait aussi à fabriquer des cordes dans le Pacifique.",t:"L'Hibiscus / Fleur de tiaré, l'ancre terrestre",b:"Fresque existante",

var SC={stream:null,raf:0,on:false,busy:false,t:0,to:0,det:null,cv:null};
function scMsg(t){document.getElementById("scmsg").textContent=t}
function scLoad(cb){if(window.jsQR||("BarcodeDetector" in window)){cb();return}var e=document.createElement("script");e.src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js";e.onload=cb;e.onerror=cb;document.head.appendChild(e)}
function scClose(){SC.on=false;cancelAnimationFrame(SC.raf);if(SC.stream){SC.stream.getTracks().forEach(function(t){t.stop()});SC.stream=null}var o=document.getElementById("scn");if(o)o.hidden=true}
function scOpen(){var o=document.getElementById("scn"),v=document.getElementById("scvid");o.hidden=false;scMsg("Autorisation de la caméra…");
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scMsg("Caméra indisponible ici (le site doit être en https). Utilise « Simuler le scan » pour la démo.");return}
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(st){if(o.hidden){st.getTracks().forEach(function(t){t.stop()});return}SC.stream=st;v.srcObject=st;v.play();SC.on=true;scMsg("Vise le QR code de la fresque");scLoad(scLoop)}).catch(function(){scMsg("Accès à la caméra refusé. Autorise-la dans le navigateur, ou utilise « Simuler le scan ».")})}
function scLoop(){var v=document.getElementById("scvid"),c=SC.cv||(SC.cv=document.createElement("canvas")),g=c.getContext("2d",{willReadFrequently:true}),det=null;
if("BarcodeDetector" in window){try{det=SC.det||(SC.det=new BarcodeDetector({formats:["qr_code"]}))}catch(e){det=null}}
function tick(){if(!SC.on)return;SC.raf=requestAnimationFrame(tick);if(v.readyState<2||!v.videoWidth)return;var n=performance.now();if(n-SC.t<120||SC.busy)return;SC.t=n;
if(det){SC.busy=true;det.detect(v).then(function(r){SC.busy=false;if(r.length)scHit(r[0].rawValue)}).catch(function(){SC.busy=false})}
else if(window.jsQR){var w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h;g.drawImage(v,0,0,w,h);var d=g.getImageData(0,0,w,h),q=jsQR(d.data,w,h);if(q)scHit(q.data)}
else scMsg("Lecteur QR non chargé (connexion ?). Utilise « Simuler le scan ».")}
tick()}
function scHit(t){var m=String(t).match(/#(\d)\s*$/);if(!m||+m[1]<1||+m[1]>6){scMsg("QR code non reconnu : vise un QR du parcours SYMBIOSYS.");return}
scClose();if(navigator.vibrate)navigator.vibrate(60);go(+m[1]-1);setTimeout(function(){scRun(true)},250)}
function vPlay(v,st){v.controls=true;v.muted=false;st.classList.add("playing");var pr=v.play();if(pr&&pr.catch)pr.catch(function(){v.muted=true;var p2=v.play();if(p2&&p2.catch)p2.catch(function(){})})}
function scRun(beam){var st=document.getElementById("stage");if(!st)return;clearTimeout(SC.to);st.classList.remove("scanning","playing","shown");var v=document.getElementById("vid");if(v){v.pause();v.currentTime=0;v.controls=false;v.onended=function(){st.classList.add("shown")}}void st.offsetWidth;
function fin(){st.classList.remove("scanning");var m=document.querySelector(".mcard");if(m){m.classList.remove("pulse");void m.offsetWidth;m.classList.add("pulse")}
if(v)vPlay(v,st);else st.classList.add("shown")}
if(beam){st.classList.add("scanning");SC.to=setTimeout(fin,2400)}else fin()}
function capTxt(s){if(!V[S.indexOf(s)])return"🔒 Fresque scannée : l'animation n'est pas encore disponible.";return s.fin?"Les 5 espèces apparaissent ensemble : l'écosystème est réuni !":"🔍 "+(s.mi||"")}

document.addEventListener("keydown",function(e){if(e.key==="Escape")scClose()});
function play(){var v=document.getElementById('vid');
if(!v){scRun(false);return}
scRun(false);
var f=v.requestFullscreen||v.webkitEnterFullscreen||v.webkitRequestFullscreen;try{if(f)f.call(v)}catch(e){}}
function go(i){cur=i;view="parcours";render();window.scrollTo(0,0);try{history.replaceState(null,"","#"+(i+1))}catch(e){}}
function setView(v){if(v==="parcours"){go(cur);return}view=v;render();window.scrollTo(0,0);try{history.replaceState(null,"","#"+(v==="about"?"apropos":"accueil"))}catch(e){}}
function fromUrl(){var h=location.hash,m=h.match(/(\d)/);if(/apropos/i.test(h))view="about";else if(m&&+m[1]>=1&&+m[1]<=6){cur=+m[1]-1;view="parcours"}else view="home"}
window.addEventListener('hashchange',function(){fromUrl();render()});
